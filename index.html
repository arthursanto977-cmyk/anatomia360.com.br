<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Anatomia Humana 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c16;
  --bg-2:#0d1424;
  --surface:#111a2e;
  --surface-2:#16213a;
  --surface-3:#1c2a47;
  --border:#233150;
  --text:#e8edf7;
  --text-dim:#a8b6cf;
  --text-faint:#6d7ea0;
  --cyan:#3fd7e0;
  --cyan-dim:#1c8a91;
  --blue:#4c8dff;
  --violet:#9b8cff;
  --green:#3ee08a;
  --amber:#f2b84b;
  --red:#f2685c;
  --pink:#ef6fa8;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:24px;
  --font-head:"Space Grotesk",system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",monospace;
}
:root[data-theme="light"]{
  --bg:#f2f6fb;
  --bg-2:#e8eef7;
  --surface:#ffffff;
  --surface-2:#eef3fa;
  --surface-3:#e2eaf5;
  --border:#d3ddec;
  --text:#0e1b30;
  --text-dim:#41567a;
  --text-faint:#7285a6;
  --cyan:#0891a8;
  --cyan-dim:#0891a8;
  --blue:#2f5fd6;
  --violet:#6a56d6;
  --green:#12925a;
  --amber:#b3760a;
  --red:#cf4436;
  --pink:#c14a83;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 800px at 15% -10%, #102243 0%, transparent 60%), var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
:root[data-theme="light"] body{ background:radial-gradient(1200px 800px at 15% -10%, #dbe7fb 0%, transparent 60%), var(--bg); }
h1,h2,h3,h4{font-family:var(--font-head);margin:0;letter-spacing:-0.01em;color:var(--text);}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--cyan);color:#04141a;}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px;}
.scroll-lock{overflow:hidden;}

/* ---------- LAYOUT SHELL ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:250px;flex-shrink:0;
  background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border-right:1px solid var(--border);
  padding:22px 16px;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:22px;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;}
.brand-mark{width:38px;height:38px;flex-shrink:0;}
.brand-text{display:flex;flex-direction:column;line-height:1.1;}
.brand-text b{font-family:var(--font-head);font-size:16px;font-weight:700;}
.brand-text span{font-size:11px;color:var(--cyan);font-family:var(--font-mono);letter-spacing:.03em;}
.nav-list{display:flex;flex-direction:column;gap:3px;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-s);
  color:var(--text-dim);font-size:14px;font-weight:600;border:1px solid transparent;
  background:transparent;width:100%;text-align:left;transition:background .15s,color .15s;
}
.nav-item svg{width:19px;height:19px;flex-shrink:0;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:linear-gradient(90deg,rgba(63,215,224,.16),rgba(63,215,224,.02));color:var(--cyan);border-color:rgba(63,215,224,.25);}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;}
.progress-mini{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-s);padding:12px;}
.progress-mini .lbl{font-size:11px;color:var(--text-faint);display:flex;justify-content:space-between;margin-bottom:7px;font-family:var(--font-mono);}
.bar-track{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .5s ease;}
.theme-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-s);padding:9px 12px;font-size:13px;font-weight:600;color:var(--text-dim);}
.switch{width:38px;height:21px;border-radius:99px;background:var(--surface-3);position:relative;border:1px solid var(--border);flex-shrink:0;}
.switch i{position:absolute;top:1px;left:1px;width:17px;height:17px;border-radius:99px;background:var(--cyan);transition:transform .2s;}
:root[data-theme="light"] .switch i{transform:translateX(17px);}

main{flex:1;min-width:0;padding:26px 30px 100px;max-width:1180px;}
.topbar-mobile{display:none;}

/* bottom nav mobile */
.bottom-nav{display:none;}

@media (max-width:900px){
  .sidebar{display:none;}
  main{padding:16px 14px 96px;}
  .topbar-mobile{
    display:flex;align-items:center;justify-content:space-between;
    padding:4px 2px 14px;position:sticky;top:0;background:var(--bg);z-index:20;
  }
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:var(--surface);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter:blur(14px);
  }
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:none;background:none;color:var(--text-faint);font-size:10.5px;font-weight:600;border-radius:10px;}
  .bn-item svg{width:20px;height:20px;}
  .bn-item.active{color:var(--cyan);}
}

/* ---------- COMMON COMPONENTS ---------- */
.eyebrow{font-family:var(--font-mono);font-size:12px;color:var(--cyan);letter-spacing:.03em;}
.page-head{margin-bottom:22px;}
.page-head h1{font-size:clamp(24px,3.2vw,34px);margin-top:6px;}
.page-head p{color:var(--text-dim);margin-top:8px;max-width:640px;font-size:14.5px;}

.searchbar{
  display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-m);padding:12px 16px;margin-bottom:8px;
}
.searchbar svg{width:18px;height:18px;color:var(--text-faint);flex-shrink:0;}
.searchbar input{flex:1;background:none;border:none;color:var(--text);font-size:15px;font-family:inherit;}
.searchbar input:focus{outline:none;}
.search-results{position:relative;}
.search-dropdown{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-m);box-shadow:0 20px 50px rgba(0,0,0,.35);z-index:40;max-height:360px;overflow-y:auto;
}
.search-dropdown .sd-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);}
.search-dropdown .sd-item:last-child{border-bottom:none;}
.search-dropdown .sd-item:hover{background:var(--surface-2);}
.sd-tag{font-size:10px;font-family:var(--font-mono);color:var(--text-faint);padding:2px 6px;border:1px solid var(--border);border-radius:99px;flex-shrink:0;}
.sd-empty{padding:16px;color:var(--text-faint);font-size:13.5px;}

.grid{display:grid;gap:14px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:900px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:repeat(2,1fr);}}
@media (max-width:520px){.grid.cols-4,.grid.cols-3{grid-template-columns:repeat(2,1fr);}}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
  padding:16px;cursor:pointer;transition:transform .15s, border-color .15s, background .15s;text-align:left;
  display:flex;flex-direction:column;gap:10px;position:relative;
}
.card:hover{border-color:var(--cyan-dim);transform:translateY(-2px);background:var(--surface-2);}
.card .fav-btn{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:99px;background:rgba(0,0,0,.25);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
.card .fav-btn svg{width:14px;height:14px;color:var(--text-faint);}
.card .fav-btn.active svg{color:var(--amber);}
.card-icon{width:52px;height:52px;}
.card h3{font-size:15px;}
.card .card-sub{font-size:12px;color:var(--text-faint);font-family:var(--font-mono);}
.card .card-desc{font-size:12.5px;color:var(--text-dim);line-height:1.45;}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-family:var(--font-mono);padding:3px 9px;border-radius:99px;background:var(--surface-3);color:var(--text-dim);border:1px solid var(--border);width:fit-content;}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:34px 0 14px;}
.section-title h2{font-size:19px;}
.section-title .see-all{font-size:12.5px;color:var(--cyan);font-weight:600;}

/* HOME */
.hero{
  background:linear-gradient(135deg,var(--surface),var(--bg-2));border:1px solid var(--border);
  border-radius:var(--radius-l);padding:32px;display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;overflow:hidden;position:relative;
}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding:22px;}}
.hero h1{font-size:clamp(26px,4vw,40px);line-height:1.08;}
.hero h1 span{color:var(--cyan);}
.hero p{color:var(--text-dim);margin-top:12px;font-size:14.5px;max-width:480px;}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:700;
  border:1px solid transparent;transition:transform .15s, filter .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(90deg,var(--cyan),var(--blue));color:#04141a;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text);}
.btn-outline:hover{background:var(--surface-2);}
.hero-figure{display:flex;align-items:center;justify-content:center;}
.hero-figure img{width:100%;max-width:230px;height:auto;}

.facts-card{background:linear-gradient(135deg,rgba(63,215,224,.08),rgba(76,141,255,.05));border:1px solid var(--border);border-radius:var(--radius-m);padding:20px;margin-top:26px;}
.facts-card h3{font-size:15px;display:flex;align-items:center;gap:8px;}
.facts-card p{margin-top:8px;font-size:13.5px;color:var(--text-dim);}
.facts-nav{display:flex;gap:6px;margin-top:14px;}
.dot{width:6px;height:6px;border-radius:99px;background:var(--surface-3);}
.dot.active{background:var(--cyan);width:18px;}

/* DETAIL / BREADCRUMB */
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-faint);margin-bottom:16px;flex-wrap:wrap;}
.crumb button{background:none;border:none;color:var(--text-faint);font-size:12.5px;font-weight:600;padding:0;}
.crumb button:hover{color:var(--cyan);}
.detail-layout{display:grid;grid-template-columns:320px 1fr;gap:24px;}
@media (max-width:900px){.detail-layout{grid-template-columns:1fr;}}
.detail-figure{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);
  padding:26px;display:flex;flex-direction:column;align-items:center;gap:16px;height:fit-content;position:sticky;top:20px;
}
@media (max-width:900px){.detail-figure{position:static;}}
.detail-figure svg{width:170px;height:170px;}
.detail-figure h2{font-size:20px;text-align:center;}
.detail-figure .sci{font-style:italic;color:var(--text-faint);font-size:13px;text-align:center;}
.detail-actions{display:flex;gap:8px;width:100%;}
.detail-actions button{flex:1;justify-content:center;}
.info-blocks{display:flex;flex-direction:column;gap:12px;}
.info-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px;}
.info-block .ib-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.info-block .ib-head svg{width:16px;height:16px;color:var(--cyan);}
.info-block .ib-head h4{font-size:13.5px;color:var(--cyan);font-family:var(--font-mono);text-transform:none;}
.info-block p{font-size:14px;color:var(--text-dim);line-height:1.6;}
.info-block ul{margin:6px 0 0;padding-left:18px;color:var(--text-dim);font-size:13.5px;line-height:1.7;}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.related-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.related-pill{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:6px 12px 6px 6px;font-size:12.5px;font-weight:600;}
.related-pill svg{width:22px;height:22px;}

/* SYSTEMS GRID special */
.sys-card{align-items:flex-start;}
.sys-card .card-icon{background:var(--surface-2);border-radius:var(--radius-s);padding:8px;width:44px;height:44px;}

/* BIOLOGY levels */
.levels-row{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:10px 2px 18px;}
.level-node{
  flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
  padding:16px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
}
.level-node.active{border-color:var(--cyan);background:var(--surface-2);}
.level-node svg{width:34px;height:34px;}
.level-arrow{color:var(--text-faint);flex-shrink:0;}
.level-arrow svg{width:18px;height:18px;}

/* QUIZ */
.quiz-diff-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.diff-card{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px;text-align:left;}
.diff-card:hover{border-color:var(--cyan-dim);}
.diff-card h3{font-size:15px;margin-bottom:4px;}
.diff-card p{font-size:12.5px;color:var(--text-faint);}
.diff-dots{display:flex;gap:4px;margin-top:10px;}
.diff-dots i{width:16px;height:5px;border-radius:99px;background:var(--surface-3);}
.diff-dots i.on{background:var(--cyan);}
.quiz-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:26px;max-width:640px;}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:12.5px;color:var(--text-faint);font-family:var(--font-mono);}
.quiz-q{font-size:18px;font-family:var(--font-head);margin-bottom:18px;}
.quiz-opts{display:flex;flex-direction:column;gap:10px;}
.opt-btn{
  text-align:left;padding:13px 16px;border-radius:var(--radius-s);border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;
}
.opt-btn:hover:not(:disabled){border-color:var(--cyan-dim);}
.opt-btn.correct{background:rgba(62,224,138,.14);border-color:var(--green);color:var(--green);}
.opt-btn.wrong{background:rgba(242,104,92,.14);border-color:var(--red);color:var(--red);}
.opt-btn:disabled{cursor:default;}
.opt-letter{width:24px;height:24px;border-radius:99px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-family:var(--font-mono);flex-shrink:0;}
.quiz-feedback{margin-top:16px;font-size:13px;color:var(--text-dim);background:var(--surface-2);border-radius:var(--radius-s);padding:12px 14px;border-left:3px solid var(--cyan);}
.quiz-nextbtn{margin-top:18px;}
.quiz-result{text-align:center;padding:30px 10px;}
.quiz-result .score-big{font-family:var(--font-head);font-size:52px;color:var(--cyan);}
.quiz-result p{color:var(--text-dim);margin-top:6px;}

/* EXPLORER */
.explorer-crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.explorer-crumbs .ec{padding:6px 13px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-dim);}
.explorer-crumbs .ec.on{color:var(--cyan);border-color:var(--cyan-dim);}
.explorer-crumbs .arrow{color:var(--text-faint);font-size:12px;}

/* FAVORITES empty */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}
.empty-state svg{width:52px;height:52px;margin-bottom:14px;opacity:.5;}
.empty-state h3{color:var(--text-dim);margin-bottom:6px;font-size:16px;}
.empty-state p{font-size:13.5px;max-width:280px;margin:0 auto;}

/* utility */
.mb-0{margin-bottom:0!important;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.filter-chip{padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-dim);}
.filter-chip.on{background:var(--cyan);color:#04141a;border-color:var(--cyan);}
.region-legend{font-size:12px;color:var(--text-faint);margin-top:10px;}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   ANATOMIA HUMANA 360 — dados educacionais (pt-BR)
   ========================================================================= */

const ICONS = {
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/>',
  body:'<circle cx="12" cy="4.5" r="2.2"/><path d="M12 7v6M8 10l4-1.2L16 10M9 20l3-7 3 7M8.5 13.5 7 20M15.5 13.5 17 20"/>',
  systems:'<circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="1.8"/><circle cx="19" cy="6" r="1.8"/><circle cx="5" cy="18" r="1.8"/><circle cx="19" cy="18" r="1.8"/><path d="M9.5 10.3 6.4 7.4M14.5 10.3l3.1-2.9M9.5 13.7 6.4 16.6M14.5 13.7l3.1 2.9"/>',
  biology:'<path d="M12 2v6M9 5h6"/><ellipse cx="12" cy="15" rx="7" ry="7"/><path d="M8 12c1.5 2 6.5 2 8 0M8 15c1.5 2 6.5 2 8 0"/>',
  quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.2 9.5a2.8 2.8 0 1 1 3.7 2.6c-.8.4-1 1-1 1.7"/><circle cx="12" cy="17" r=".4" fill="currentColor"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  star:'<path d="M12 3.5 14.6 9l6 .9-4.3 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.4 9.9l6-.9Z"/>',
  bone:'<path d="M6 6a2.5 2.5 0 1 1 3.5 2.3l5 5A2.5 2.5 0 1 1 18 18a2.5 2.5 0 0 1-3.7-2.3l-5-5A2.5 2.5 0 0 1 6 6Z"/>',
  chevronR:'<path d="m9 6 6 6-6 6"/>',
  chevronL:'<path d="m15 6-6 6 6 6"/>',
  location:'<path d="M12 21s7-6.5 7-11.5a7 7 0 1 0-14 0C5 14.5 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/>',
  function:'<path d="M4 12h4l2-7 4 14 2-7h4"/>',
  importance:'<path d="M12 3.5 14.6 9l6 .9-4.3 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.4 9.9l6-.9Z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18 6l-1.5 1.5M7.5 16.5 6 18M18 18l-1.5-1.5M7.5 7.5 6 6"/>',
  link:'<path d="M9 15 15 9"/><path d="M10 6h1a3.5 3.5 0 0 1 0 7h-1"/><path d="M14 18h-1a3.5 3.5 0 0 1 0-7h1"/>',
  fact:'<circle cx="12" cy="12" r="9"/><path d="M12 8v.01M11 11h1v6h1"/>',
  arrowRight:'<path d="M5 12h14M13 6l6 6-6 6"/>',
};
function icon(name,cls){return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||''}</svg>`;}

{id:'pulmoes',nome:'Pulmões',sistema:'respiratorio',shape:'lung',cor:'cyan',

{id:'traqueia',nome:'Traqueia',sistema:'respiratorio',shape:'tube',cor:'cyan',

{id:'bronquios',nome:'Brônquios',sistema:'respiratorio',shape:'tube',cor:'cyan',

{id:'diafragma',nome:'Diafragma',sistema:'respiratorio',shape:'muscle',cor:'cyan',

{id:'esofago',nome:'Esôfago',sistema:'digestorio',shape:'tube',cor:'amber',

{id:'estomago',nome:'Estômago',sistema:'digestorio',shape:'blob',cor:'amber',

 curiosidades:['O suco gástrico é tão ácido que poderia dissolver metal, mas o muco protege as paredes do estômago.','Pode se expandir para armazenar até cerca de 1 litro de alimento.']},
{id:'figado',nome:'Fígado',sistema:'digestorio',shape:'blob',cor:'amber',

 relacionados:['digestorio','cardiovascular'],
 curiosidades:['É o maior órgão interno sólido do corpo.','Tem uma notável capacidade de regeneração, podendo recuperar seu tamanho mesmo após remoção parcial.']},
{id:'vesicula-biliar',nome:'Vesícula Biliar',sistema:'digestorio',shape:'blob',cor:'amber',

{id:'pancreas',nome:'Pâncreas',sistema:'digestorio',shape:'gland',cor:'amber',

 importancia:'Fundamental tanto para a digestão quanto para o controle dos níveis de glicose no sangue.',

 relacionados:['digestorio','endocrino'],
 curiosidades:['A insulina, produzida no pâncreas, é essencial para as células absorverem glicose.','O pâncreas atua tanto como glândula exócrina quanto endócrina.']},
{id:'intestino-delgado',nome:'Intestino Delgado',sistema:'digestorio',shape:'tube',cor:'amber',

{id:'intestino-grosso',nome:'Intestino Grosso',sistema:'digestorio',shape:'tube',cor:'amber',

{id:'reto',nome:'Reto',sistema:'digestorio',shape:'tube',cor:'amber',

{id:'rins',nome:'Rins',sistema:'urinario',shape:'blob',cor:'blue',

{id:'ureteres',nome:'Ureteres',sistema:'urinario',shape:'tube',cor:'blue',

{id:'bexiga',nome:'Bexiga',sistema:'urinario',shape:'blob',cor:'blue',

{id:'baco',nome:'Baço',sistema:'linfatico',shape:'blob',cor:'green',

{id:'timo',nome:'Timo',sistema:'linfatico',shape:'gland',cor:'green',

{id:'linfonodos',nome:'Linfonodos',sistema:'linfatico',shape:'gland',cor:'green',

/* =========================================================================
   ESTADO / PERSISTÊNCIA (localStorage — por navegador/visitante)
   ========================================================================= */
const LS_KEY='ah360_state_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {favorites:[],visited:[],theme:'dark',quizScores:{}};
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
let state = loadState();
if(!state.favorites) state.favorites=[];
if(!state.visited) state.visited=[];
if(!state.quizScores) state.quizScores={};
document.documentElement.setAttribute('data-theme', state.theme||'dark');

function markVisited(id){ if(!state.visited.includes(id)){ state.visited.push(id); saveState(); } }
function toggleFav(id){ 
  const i = state.favorites.indexOf(id);
  if(i>=0) state.favorites.splice(i,1); else state.favorites.push(id);
  saveState(); render();
}
function isFav(id){ return state.favorites.includes(id); }

const TOTAL_TRACKABLE = ORGAOS.length + OSSOS.length + MUSCULOS.length + BIOLOGIA.length;
function progressPct(){ return Math.min(100, Math.round((new Set(state.visited).size / TOTAL_TRACKABLE) * 100)); }

   ========================================================================= */
let route = {page:'home'};

function go(page, params){ route = Object.assign({page}, params||{}); window.scrollTo({top:0,behavior:'instant'}); render(); }

/* helper lookups */
function findOrgao(id){ return ORGAOS.find(o=>o.id===id); }
function findSistema(id){ return SISTEMAS.find(s=>s.id===id); }
function findOsso(id){ return OSSOS.find(o=>o.id===id); }
function findMusculo(id){ return MUSCULOS.find(o=>o.id===id); }
function findBio(id){ return BIOLOGIA.find(o=>o.id===id); }

/* fuzzy-ish search across everything */
function buildSearchIndex(){
  const idx=[];
  ORGAOS.forEach(o=>idx.push({type:'Estrutura',label:o.nome,id:o.id,go:['organ',{id:o.id}]}));
  SISTEMAS.forEach(s=>idx.push({type:'Sistema',label:s.nome,id:s.id,go:['system',{id:s.id}]}));
  OSSOS.forEach(o=>idx.push({type:'Osso',label:o.nome,id:o.id,go:['bone',{id:o.id}]}));
  MUSCULOS.forEach(o=>idx.push({type:'Músculo',label:o.nome,id:o.id,go:['muscle',{id:o.id}]}));
  BIOLOGIA.forEach(o=>idx.push({type:'Biologia',label:o.nome,id:o.id,go:['bio',{id:o.id}]}));
  REGIOES.forEach(o=>idx.push({type:'Região',label:o.nome,id:o.id,go:['region',{id:o.id}]}));
  return idx;
}
const SEARCH_INDEX = buildSearchIndex();
function doSearch(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  return SEARCH_INDEX.filter(it=> it.label.toLowerCase().includes(q) ).slice(0,10);
}

let __factInterval = null;
function startFactRotation(){
  if(__factInterval) clearInterval(__factInterval);
  __factInterval = setInterval(()=>{
    if(route.page!=='home') return;
    factIndex = (factIndex+1) % FACTS.length;
    const t = document.getElementById('factText');
    if(t){ t.textContent = FACTS[factIndex]; const d=document.getElementById('factDots'); if(d) d.innerHTML = FACTS.map((_,i)=>`<div class="dot ${i===factIndex?'active':''}"></div>`).join(''); }
  }, 6000);
}

let quizState = null;
function pageQuizHome(){
  return `

    <h1>Quiz de Anatomia</h1>
    <p>Escolha um nível de dificuldade para começar.</p>
  </div>
  <div class="quiz-diff-row">
    ${[
      {id:'iniciante',n:1,desc:'Perguntas básicas sobre órgãos e localização.'},
      {id:'intermediario',n:2,desc:'Funções mais específicas e relações entre estruturas.'},
      {id:'avancado',n:3,desc:'Conceitos detalhados de anatomia e biologia.'},
    ].map(d=>`
    <button class="diff-card" data-diff="${d.id}">
      <h3 style="text-transform:capitalize">${d.id}</h3>
      <p>${d.desc}</p>

    </button>`).join('')}
  </div>
  ${Object.keys(state.quizScores).length?`
  <div class="section-title mb-0"><h2>Suas últimas pontuações</h2></div>
  <div class="grid cols-3" style="margin-top:12px;">
    ${Object.entries(state.quizScores).map(([k,v])=>`<div class="card" style="cursor:default;"><h3 style="text-transform:capitalize">${k}</h3><p class="card-desc">${v.score}/${v.total} acertos</p></div>`).join('')}
  </div>`:''}
  `;
}
function pageQuizPlay(){
  if(!quizState) return `<p>Selecione um nível de dificuldade.</p>`;
  const list = QUIZZES[quizState.diff];
  const q = list[quizState.i];
  return `
  <div class="quiz-box">
    <div class="quiz-progress"><span style="text-transform:capitalize">${quizState.diff}</span><span>Pergunta ${quizState.i+1} de ${list.length} · Pontos: ${quizState.score}</span></div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts">
      ${q.opts.map((opt,i)=>{
        let cls='opt-btn';
        if(quizState.answered){ if(i===q.r) cls+=' correct'; else if(i===quizState.selected) cls+=' wrong'; }
        return `<button class="${cls}" data-opt="${i}" ${quizState.answered?'disabled':''}>
        <span class="opt-letter">${String.fromCharCode(65+i)}</span>${opt}
      </button>`;}).join('')}
    </div>
    ${quizState.answered?`<div class="quiz-feedback">${q.exp}</div>
    <button class="btn btn-primary quiz-nextbtn" data-quiznext>${quizState.i<list.length-1?'Próxima pergunta':'Ver resultado'} ${icon('arrowRight')}</button>`:''}
  </div>
  `;
}
function pageQuizResult(){
  const list = QUIZZES[quizState.diff];
  return `
  <div class="quiz-box quiz-result">
    <div class="score-big">${quizState.score}/${list.length}</div>
    <p>Você concluiu o quiz de nível <b style="text-transform:capitalize;color:var(--text)">${quizState.diff}</b>.</p>

}

/* biology level click delegation (event bubbling, bound once) */
/* =========================================================================
   DELEGAÇÃO GLOBAL DE EVENTOS
   Um único ponto de escuta para toda a aplicação: como o conteúdo de #page
   é recriado a cada navegação, ligar eventos elemento-a-elemento depois de
   cada render() é frágil. Delegar no document garante que todo botão,
   cartão e link funcione sempre, em qualquer página, sem religar nada.
   ========================================================================= */
document.addEventListener('click', (e)=>{
  // alternância de tema
  if(e.target.closest('[data-theme-toggle]')){
    state.theme = state.theme==='dark' ? 'light':'dark';
    document.documentElement.setAttribute('data-theme', state.theme);
    saveState(); render();
    return;
  }
  // favoritar (checado antes de data-go pois o botão de favorito fica dentro do cartão)
  const favBtn = e.target.closest('[data-fav]');
  if(favBtn){ toggleFav(favBtn.dataset.fav); return; }

  // navegação principal (sidebar / bottom nav / botões "ver todos" / hero)
  const navBtn = e.target.closest('[data-nav]');
  if(navBtn){ go(navBtn.dataset.nav); return; }

  // resultado de busca
  const sdItem = e.target.closest('[data-r]');
  if(sdItem){ const [p,id] = sdItem.dataset.r.split(':'); go(p,{id}); return; }

  // breadcrumbs
  const crumbBtn = e.target.closest('[data-crumb]');
  if(crumbBtn){ const [p,id] = crumbBtn.dataset.crumb.split(':'); go(p, id?{id}:{}); return; }

  // cartões clicáveis (órgãos, sistemas, ossos, músculos, regiões, biologia...)
  const goBtn = e.target.closest('[data-go]');
  if(goBtn){ const [p,id] = goBtn.dataset.go.split(':'); go(p,{id}); return; }

  // escolha de dificuldade do quiz
  const diffBtn = e.target.closest('[data-diff]');
  if(diffBtn){ quizState = {diff:diffBtn.dataset.diff, i:0, score:0, answered:false, selected:null}; go('quizplay'); return; }

  // resposta do quiz
  const optBtn = e.target.closest('[data-opt]');
  if(optBtn && !optBtn.disabled && quizState){
    const list = QUIZZES[quizState.diff];
    const q = list[quizState.i];
    const sel = parseInt(optBtn.dataset.opt,10);
    quizState.answered = true; quizState.selected = sel;
    if(sel===q.r) quizState.score++;
    renderPage();
    return;
  }

  // próxima pergunta / ver resultado
  if(e.target.closest('[data-quiznext]')){
    const list = QUIZZES[quizState.diff];
    if(quizState.i < list.length-1){
      quizState.i++; quizState.answered=false; quizState.selected=null;
      renderPage();
    } else {
      state.quizScores[quizState.diff] = {score:quizState.score, total:list.length};
      saveState();
      go('quizresult');
    }
    return;
  }

  // tentar quiz novamente
  if(e.target.closest('[data-retry]')){
    quizState = {diff:quizState.diff, i:0, score:0, answered:false, selected:null};
    go('quizplay');
    return;
  }

  // níveis de organização da biologia (Célula → Tecido → Órgão → Sistema → Organismo)
  const lvl = e.target.closest('[data-level]');
  if(lvl){
    const id = lvl.dataset.level;
    route.levelSel = id;
    const b = findBio(id);
    markVisited(id);
    document.querySelectorAll('.level-node').forEach(n=>n.classList.remove('active'));
    lvl.classList.add('active');
    const infoBox = document.getElementById('levelInfo');
    if(infoBox) infoBox.innerHTML = `
      <div class="info-block" style="margin:6px 0 30px;">
        <div class="ib-head"><span style="font-size:18px;">${b.emoji}</span><h4>${b.nome.toUpperCase()}</h4></div>
        <p>${b.texto}</p>
      </div>`;
    return;
  }
});

// campos de busca (Início e Explorador) — delegado via evento 'input', que também sobe (bubble)
document.addEventListener('input', (e)=>{
  let boxId = null;
  if(e.target.id==='homeSearch') boxId='homeSearchResults';
  else if(e.target.id==='expSearch') boxId='expSearchResults';
  else return;
  const box = document.getElementById(boxId);
  if(!box) return;
  const val = e.target.value;
  if(!val.trim()){ box.innerHTML=''; return; }
  const res = doSearch(val);
  box.innerHTML = `<div class="search-dropdown">${
    res.length ? res.map(r=>`<div class="sd-item" data-r="${r.go[0]}:${r.go[1].id}"><span class="sd-tag">${r.type}</span><span>${r.label}</span></div>`).join('')
    : `<div class="sd-empty">Nenhum resultado encontrado.</div>`
  }</div>`;
});

// acessibilidade por teclado: cartões são <div role="button" tabindex="0">
document.addEventListener('keydown', (e)=>{
  if((e.key==='Enter' || e.key===' ') && e.target.matches('[role="button"]')){
    e.preventDefault();
    e.target.click();
  }
});

/* initial render */
render();
</script>
